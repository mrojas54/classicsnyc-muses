<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classics NYC Muses</title>
<style>
  :root{
    --ink:#2b211a; --soft:#6b5d4f; --parch:#f4ebdc; --parch2:#efe3cf;
    --wine:#7c2331; --gold:#b8862f; --olive:#5d6b3a; --sky:#3f5a6b;
    --ok:#46663d; --ok-bg:#e6efd9; --no:#8a3a3f; --no-bg:#f3dcd9;
    --card:#fffaf0; --line:#e0d2ba;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0; background:radial-gradient(120% 100% at 50% 0%, #f7efe0 0%, #ecdcc2 100%);
    color:var(--ink); font-family:Georgia,'Times New Roman',serif; line-height:1.6; padding:20px 16px 80px;}
  .wrap{max-width:660px; margin:0 auto;}

  /* masthead */
  .masthead{text-align:center; margin:6px 0 18px;}
  .masthead .mark{font-size:15px; letter-spacing:6px; text-transform:uppercase; color:var(--wine);}
  .masthead .mark b{font-weight:normal;}
  .masthead .by{color:var(--soft); font-style:italic; font-size:13px; margin-top:5px; letter-spacing:.5px;}
  .masthead .rule{width:64px; height:1px; background:var(--gold); margin:12px auto 0; opacity:.7;}

  /* persistent nav bar */
  .topbar{display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap;
    margin-bottom:24px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  .topbar:empty{display:none;}
  .topbar .grp{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .topbar button{font:inherit; font-size:13px; background:var(--parch); border:1px solid var(--line);
    color:var(--soft); border-radius:20px; padding:6px 13px; cursor:pointer; transition:.15s;}
  .topbar button:hover:not(:disabled){border-color:var(--gold);}
  .topbar button:disabled{opacity:.35; cursor:default;}
  .topbar button.active{background:var(--olive); color:#fbeede; border-color:var(--olive);}
  .topbar .pos{font-style:italic; color:var(--soft); font-size:14px;}
  .topbar .readtoggle.on{background:var(--olive); color:#fbeede; border-color:var(--olive);}

  /* the shelf — one pill per work; the open one is lit */
  .shelf{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 16px;}
  .shelf button{font:inherit; font-size:13px; background:var(--parch); border:1px solid var(--line);
    color:var(--soft); border-radius:20px; padding:7px 15px; cursor:pointer; transition:.15s; letter-spacing:.3px;}
  .shelf button:hover{border-color:var(--gold);}
  .shelf button.active{background:var(--wine); color:#fbeede; border-color:var(--wine); cursor:default;}
  .shelf button .st{font-size:10px; letter-spacing:1.5px; text-transform:uppercase; opacity:.75; margin-left:7px;}

  /* home — progress + grid */
  .progress{text-align:center; color:var(--soft); font-size:13px; letter-spacing:1px; margin:4px 0 6px;}
  .progbar{height:6px; background:var(--parch2); border-radius:4px; overflow:hidden; margin:8px auto 14px; max-width:360px;}
  .progbar > i{display:block; height:100%; background:var(--gold); transition:width .4s ease;}
  .homeacts{text-align:center; margin:0 0 22px;}
  .homeacts button{font:inherit; font-size:13px; background:var(--parch); border:1px solid var(--line);
    color:var(--wine); border-radius:20px; padding:7px 16px; cursor:pointer; transition:.15s; letter-spacing:.5px;}
  .homeacts button:hover{border-color:var(--gold);}
  .band{display:flex; align-items:center; gap:12px; margin:26px 0 14px;}
  .band hr{flex:1; border:none; border-top:1px solid var(--line);}
  .band span{color:var(--gold); font-size:12px; letter-spacing:3px; text-transform:uppercase; white-space:nowrap;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:10px;}
  .cell{border:1px solid var(--line); border-radius:11px; padding:10px 8px; text-align:center; background:var(--card);
    cursor:pointer; transition:.12s; min-height:84px; display:flex; flex-direction:column; justify-content:center; gap:3px;}
  .cell:hover{border-color:var(--gold); transform:translateY(-1px);}
  .cell .bk{font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--wine);}
  .cell .tt{font-size:11px; color:var(--soft); line-height:1.25; max-height:2.6em; overflow:hidden;}
  .cell .st{font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--olive);}
  .cell.read{box-shadow:inset 0 0 0 2px #5d6b3a55;}
  .cell.unwritten{background:transparent; border-style:dashed; cursor:default; opacity:.5;}
  .cell.unwritten:hover{transform:none; border-color:var(--line);}
  .cell.unwritten .bk{color:var(--soft);}

  /* book view */
  .crown{text-align:center; color:var(--wine); letter-spacing:3px; font-size:13px; text-transform:uppercase; margin-bottom:6px;}
  h1{text-align:center; font-size:29px; margin:0 0 4px; font-weight:normal;}
  .sub{text-align:center; color:var(--soft); font-style:italic; font-size:15px; margin-bottom:8px;}
  .meta{text-align:center; color:var(--gold); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:26px;}
  .scene{background:linear-gradient(160deg, #2a2030 0%, #1f2a33 100%); color:#e9dcc6; border-radius:16px; padding:24px 22px; margin-bottom:30px; font-size:16px;}
  .scene .lbl{color:#d9b366; font-size:12px; letter-spacing:3px; text-transform:uppercase; text-align:center; display:block; margin-bottom:12px;}
  .scene p{margin:0 0 12px;} .scene p:last-child{margin-bottom:0;} .scene i{color:#f0e2c8;}
  .recap{background:var(--parch2); border:1px solid var(--line); border-left:4px solid var(--wine); border-radius:12px; padding:18px 20px; margin-bottom:26px; font-size:15px; font-style:italic; color:var(--soft);}
  .recap .lbl{color:var(--wine); font-size:11px; letter-spacing:3px; text-transform:uppercase; text-align:center; display:block; margin-bottom:10px; font-style:normal;}
  .recap p{margin:0 0 10px;} .recap p:last-child{margin-bottom:0;} .recap b{color:var(--ink); font-style:normal; font-weight:normal;}
  .invoke{background:var(--wine); color:#fbeede; border-radius:16px; padding:22px; margin-bottom:30px; text-align:center; font-style:italic; font-size:17px;}
  .invoke .src{display:block; font-style:normal; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#e8c79a; margin-top:12px;}
  .movement{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 20px; margin-bottom:18px; box-shadow:0 2px 10px #00000010;}
  .mnum{color:var(--gold); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px;}
  .mtitle{font-size:21px; margin:0 0 12px; font-weight:normal;}
  .movement p{margin:0 0 12px;} .movement p:last-child{margin-bottom:0;}
  .why{border-left:3px solid var(--gold); background:#fbf4e3; padding:11px 15px; border-radius:0 8px 8px 0; font-size:15px; color:var(--soft); margin-top:4px;}
  .why b{color:var(--ink);}
  .who{color:var(--wine); font-style:italic;} .god,.cap{color:var(--sky); font-style:italic;} .ver{color:var(--olive); font-style:italic;}
  .simile{margin:26px 0; padding:18px 20px; border:1px dashed var(--gold); border-radius:12px; background:#fdf7ea; font-style:italic; color:var(--soft); font-size:15px;}
  .simile .lbl{display:block; font-style:normal; color:var(--gold); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; text-align:center;}
  .simile p{margin:0 0 9px;} .simile p:last-child{margin-bottom:0;}
  .terms{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:18px;}
  .terms .t{margin-bottom:11px;} .terms .t:last-child{margin-bottom:0;}
  .terms .gk{color:var(--wine); font-style:italic; font-weight:bold;} .terms .df{color:var(--soft); font-size:15px;}
  .c{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:15px 18px; margin-bottom:12px; box-shadow:0 2px 9px #00000010;}
  .c .nm{font-size:18px; margin:0;} .c .ep{font-style:italic; font-size:13.5px; margin:1px 0 8px; color:var(--wine);} .c .ep.god,.c .ep.cap{color:var(--sky);} .c .ep.ver{color:var(--olive);}
  .c .ep.has-variants{margin-bottom:2px;}
  .c .eplist{margin:0 0 8px; padding:0;}
  .c .epvar{display:flex; flex-wrap:wrap; align-items:baseline; gap:0 8px; font-size:13px; line-height:1.7;}
  .c .epvar::before{content:"·"; color:var(--gold); margin-right:2px;}
  .c .epvar .ept{font-style:italic; color:var(--wine);}
  .c .eplist.god .epvar .ept,.c .eplist.cap .epvar .ept{color:var(--sky);} .c .eplist.ver .epvar .ept{color:var(--olive);}
  .c .epvar .epbooks{font-size:11px; letter-spacing:1.4px; color:var(--gold); white-space:nowrap;}
  .c .rlfrom{font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--gold); margin:10px 0 -2px;}
  .c .rl{margin:0; font-size:15px;}
  .tag{display:inline-block; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--olive); border:1px solid var(--line); border-radius:20px; padding:2px 9px; margin-top:9px;}
  /* roster: the books a player walks through */
  .c .seen{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); margin:12px 0 6px;}
  .c .castbooks{display:flex; flex-wrap:wrap; gap:7px;}
  .c .castbooks .lk{font:inherit; font-size:12.5px; background:var(--parch); border:1px solid var(--line); color:var(--wine); border-radius:20px; padding:5px 12px; cursor:pointer; transition:.15s;}
  .c .castbooks .lk:hover{border-color:var(--gold);}
  .c .castbooks .lk:active{transform:translateY(1px);}

  /* threads */
  .thread{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:14px; box-shadow:0 2px 9px #00000010;}
  .thread .dir{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); margin-bottom:6px;}
  .thread .tt{font-size:18px; margin:0 0 8px; font-weight:normal;}
  .thread .nt{margin:0 0 13px; font-size:15px; color:var(--soft);}
  .thread .lk{font:inherit; font-size:13px; background:var(--parch); border:1px solid var(--line); color:var(--wine); border-radius:20px; padding:6px 13px; cursor:pointer; transition:.15s;}
  .thread .lk:hover{border-color:var(--gold);}
  .thread .lk:disabled{opacity:.45; cursor:default; color:var(--soft);}
  .thread .from{font-size:12px; color:var(--soft); font-style:italic; margin-bottom:8px;}

  /* the day's measure */
  .rite{background:var(--card); border:1px solid var(--line); border-radius:10px;
        padding:14px 16px; margin:14px 0 6px;}
  .rite .hd{font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--wine);}
  .rite .goal{font-size:17px; margin:6px 0 2px;}
  .rite .goal b{color:var(--wine);}
  .rite .meta{font-size:13px; color:var(--soft); font-style:italic;}
  .rite .streak{font-size:13px; color:var(--gold); margin-top:4px;}
  .rite .door{font-size:13px; color:var(--soft); margin-top:4px;}
  .rite .adj{background:none; border:1px solid var(--line); color:var(--soft);
             border-radius:6px; min-width:34px; min-height:34px; font:inherit; cursor:pointer;}
  .rite .adj:active{background:var(--parch2);}

  /* the fraying thread — a barometer, never a life bar */
  .fraythread{display:flex; align-items:center; gap:8px; justify-content:center; margin:12px 0 4px;}
  .fraythread .pips{display:flex; gap:5px;}
  .fraythread .pip{width:9px; height:9px; border-radius:50%; background:var(--gold);
                   transition:background .35s, opacity .35s;}
  .fraythread .pip.frayed{background:transparent; box-shadow:inset 0 0 0 1px var(--no); opacity:.55;}
  .fraythread .shears{color:var(--soft); font-size:15px; transition:color .35s;}
  .fraythread .shears.near{color:var(--no);}
  .fraythread .lbl{font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--soft);}

  /* sequence omens — tap the beats into their true order */
  .seq{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .seq .beat{text-align:left; background:var(--card); border:1px solid var(--line);
             border-radius:8px; padding:11px 13px; font:inherit; color:var(--ink);
             cursor:pointer; min-height:44px;}
  .seq .beat:active{background:var(--parch2);}
  .seq .beat.chosen{border-color:var(--gold); color:var(--soft);}
  .seq .beat .ord{color:var(--wine); font-weight:bold; margin-right:8px;}
  .seq .beat[disabled]{cursor:default;}

  /* quiz */
  .divider{text-align:center; color:var(--gold); letter-spacing:6px; margin:34px 0 26px; font-size:16px;}
  .gate{text-align:center; margin-bottom:8px;}
  .gate h2{font-size:24px; font-weight:normal; margin:0 0 4px;}
  .priorscore{text-align:center; color:var(--soft); font-size:13px; font-style:italic; margin:6px 0 6px;}
  .missnote{text-align:center; color:var(--wine); font-size:13px; font-style:italic; margin:0 0 14px;}
  .tally{text-align:center; color:var(--soft); font-size:13px; letter-spacing:2px; margin:0 0 18px; text-transform:uppercase;}
  .q{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 18px; margin-bottom:18px; box-shadow:0 2px 10px #00000010;}
  .qhead{display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .qn{color:var(--gold); font-size:12px; letter-spacing:2px; text-transform:uppercase;}
  .reviewfrom{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--soft); margin-bottom:6px;}
  .q.cleared{opacity:.6;}
  #reviewdone{display:none; text-align:center; background:var(--olive); color:#f3f7ea; border-radius:16px; padding:26px 22px; margin-top:8px;}
  #reviewdone.show{display:block; animation:fade .4s ease;}
  #reviewdone .rsum{font-size:18px; font-style:italic; margin:8px 0 4px;}
  #reviewdone button{font:inherit; margin-top:16px; background:#f3f7ea; color:var(--olive); border:none; border-radius:20px; padding:8px 18px; cursor:pointer; letter-spacing:1px;}
  .qkind{display:inline-block; font-size:10px; letter-spacing:1px; text-transform:uppercase; border-radius:20px; padding:2px 9px;}
  .k-event{color:var(--olive); border:1px solid #5d6b3a55; background:#eef2e3;}
  .k-meaning{color:var(--sky); border:1px solid #3f5a6b44; background:#e7eef2;}
  .k-thread{color:var(--wine); border:1px solid #7c233144; background:#f6e6e7;}
  .missflag{font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold); border-radius:20px; padding:2px 9px;}
  .qt{font-size:18px; margin-bottom:16px;}
  .opt{display:block; width:100%; text-align:left; font:inherit; font-size:16px; background:var(--parch); border:1px solid var(--line); border-radius:10px; padding:13px 15px; margin-bottom:10px; cursor:pointer; color:var(--ink); transition:transform .08s ease, background .15s ease, border-color .15s ease;}
  .opt:active{transform:scale(.99);} .opt:hover{border-color:var(--gold);}
  .opt.correct{background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:bold;}
  .opt.wrong{background:var(--no-bg); border-color:var(--no); color:var(--no);}
  .opt:disabled{cursor:default;}
  .truth{display:none; margin-top:4px; padding:13px 15px; border-left:3px solid var(--gold); background:#fbf4e3; border-radius:0 8px 8px 0; font-size:15px; color:var(--soft);}
  .truth b{color:var(--ink);} .truth.show{display:block; animation:fade .3s ease;}
  .examsrc{margin-top:10px; color:var(--gold); font-size:12px; letter-spacing:1px; text-transform:uppercase;}
  @keyframes fade{from{opacity:0; transform:translateY(-3px);} to{opacity:1;}}
  #verdict{display:none; text-align:center; background:var(--wine); color:#fbeede; border-radius:16px; padding:28px 22px; margin-top:8px;}
  #verdict.show{display:block; animation:fade .4s ease;}
  #verdict .score{font-size:46px; letter-spacing:2px; margin:6px 0;}
  #verdict .vline{font-size:19px; font-style:italic; margin-top:10px;}
  #verdict .breakdown{margin-top:16px;}
  #verdict .bk{display:inline-block; margin:3px 5px; padding:4px 12px; border-radius:20px; background:#ffffff1a; border:1px solid #ffffff33; font-size:13px; letter-spacing:.5px;}
  /* per-book reckoning: one row per book, canonical reading order, a bar for the ratio */
  #verdict .books{margin:20px auto 4px; max-width:340px; text-align:left;}
  #verdict .books h4{margin:0 0 10px; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#e8c79a; text-align:center; font-weight:normal;}
  #verdict .brow{display:flex; align-items:center; gap:10px; margin:6px 0; font-size:13px; letter-spacing:.5px;}
  #verdict .brow .bl{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.9;}
  #verdict .brow .bbar{flex:0 0 64px; height:5px; border-radius:3px; background:#ffffff1a; overflow:hidden;}
  #verdict .brow .bbar i{display:block; height:100%; background:#e8c79a;}
  #verdict .brow .bsc{flex:0 0 auto; font-variant-numeric:tabular-nums; opacity:.85;}
  #verdict .brow.weak .bl{color:#e8c79a; opacity:1;}
  #verdict .brow.weak .bbar i{background:#c98b8b;}
  #verdict .small{font-size:13px; opacity:.85; margin-top:16px; letter-spacing:1px;}
  #verdict button{font:inherit; margin-top:16px; background:#fbeede; color:var(--wine); border:none; border-radius:20px; padding:8px 18px; cursor:pointer; letter-spacing:1px;}
  .footnav{display:flex; gap:10px; justify-content:space-between; margin-top:34px; padding-top:18px; border-top:1px solid var(--line);}
  .footnav button{font:inherit; font-size:14px; background:var(--parch); border:1px solid var(--line); color:var(--soft); border-radius:22px; padding:9px 16px; cursor:pointer; transition:.15s;}
  .footnav button:hover:not(:disabled){border-color:var(--gold);} .footnav button:disabled{opacity:.35; cursor:default;}
  .empty{text-align:center; color:var(--soft); font-style:italic; padding:60px 20px;}

  /* P1: tactile press feedback on nav/link/action pills — :hover is invisible on
     touch, so taps gave no cue. Mirrors the quiz options' existing :active state. */
  .topbar button:active:not(:disabled), .homeacts button:active, .shelf button:active:not(.active),
  .thread .lk:active:not(:disabled), .footnav button:active:not(:disabled){
    transform:scale(.98); border-color:var(--gold);
  }

  /* --- mobile (phones ≤480px) — everything above stays the desktop layout --- */
  @media (max-width:480px){
    /* P0: the Threads view's long "From … — Title" band labels were white-space:nowrap
       at 394–496px intrinsic width, forcing the whole page to scroll sideways on a
       ~343px phone content box. Let band labels wrap instead (min-content is only a
       short word, so they fit); the short home/section bands are unaffected. */
    .band span{ white-space:normal; }
    /* P1: nav/link/action pills were ~35px tall — under the 44px touch-target min. */
    .topbar button, .homeacts button, .shelf button, .thread .lk, .footnav button{ min-height:44px; }
    /* P1: wrapped topbar rows align left instead of spreading with ragged gaps. */
    .topbar{ justify-content:flex-start; }
    /* P1: lift the two 10px labels to 11px — the smallest text in the app. */
    .cell .st, .qkind{ font-size:11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="mark">✦ Classics NYC · <b>Muses</b> ✦</div>
    <div class="by">the book club's reading companions — one Muse for each work on the shelf</div>
    <div class="rule"></div>
  </div>
  <div class="topbar" id="topbar"></div>
  <div id="view"></div>
</div>

<script src="../data/manifest.js"></script>
<script src="clock.js"></script>
<script src="omens.js"></script>
<script>
/* ---- data registry ---- */
window.LOOM_DATA = window.LOOM_DATA || {};
const LOAD = window.LOOM_BOOKS || [];          // authored ids to actually load (avoids 404s)
const WORKS = window.LOOM_WORKS || [];         // the shelf (data/manifest.js)

/* ---- the shelf ----
   One work is open at a time. PLAN, ORDER, the labels, and the diction (V) are all
   derived from that work, so every view below reads the same whichever work is up.
   Storage keys are per unit id (`loom.read.iliad-01`, `loom.best.rj-02`), so the two
   works never collide; the day log, goal, and streak are the reader's, shared. */
const pad = n => String(n).padStart(2,'0');
const fmt = (tpl, vars) => String(tpl).replace(/\{(\w+)\}/g, (m,k) => (vars && vars[k]!==undefined) ? vars[k] : m);

/* The Loom / the Fates: the register the Homer work was written in. Every string a
   view speaks lives here; a work's `voice` in the manifest overrides any key. */
const VOICE_DEFAULT = {
  allUnits: "✦ All Books",
  progress: "{a} of {n} books on the loom · {r} read",
  dayKept: "The thread is spun. The day is kept.",
  dayHow: "A book is kept when it is read and its omens hold.",
  streakWaits: "✦ the thread waits to be spun",
  volatile: "This copy cannot keep a streak — open it from the web to have the Fates remember.",
  doorFar: "Atropos waits {days} {dayWord} hence · {left}",
  doorLive: "Atropos arrives in {label} · {deadlineLabel}{unread}",
  doorPast: "The theater door has opened · {left}",
  unreadLeft: "{left} {unitWord} on the loom, unread",
  unreadLeftPast: "{left} {unitWord} unread",
  unreadNone: "every written book is read",
  unreadNonePast: "every written book was read",
  riteBtn: "☼ The Daily Rite (practice) →",
  examBtn: "◈ The Grand Examination ({n}) →",
  castBtn: "☙ The players ({n}) →",
  threadsBtn: "✦ The woven threads ({n}) →",
  reviewBtn: "↺ Re-walk the missed omens ({n}) →",
  riteTab: "The Daily Rite",
  riteCrown: "◈ The Loom offers practice ◈",
  riteTitle: "The Daily Rite",
  riteEmpty: "Mark a book read and the Loom will draw from it.",

/* quiz kinds — the two comprehension layers, plus the cross-unit thread */
const KIND = {
  event:   { label:"Event recall",  cls:"k-event"   },
  meaning: { label:"Why it matters", cls:"k-meaning" },
  thread:  { label:"Cross-book thread", cls:"k-thread" }
};

let WORK = null, V = VOICE_DEFAULT, PLAN = [], ORDER = [];
function planFor(work){
  const out = [];
  work.parts.forEach(p => { for(let i=1;i<=p.count;i++) out.push({ id:`${p.prefix}-${pad(i)}`, epic:p.name, short:p.short, n:i, part:p }); });
  return out;
}
const workOf = id => WORKS.find(w => w.parts.some(p => String(id).startsWith(p.prefix + '-'))) || null;
const unitWord = n => n===1 ? WORK.unit.toLowerCase() : WORK.unit.toLowerCase() + 's';
/* the Homer examination predates the shelf; its best score stays under the old key */
const examKey = () => WORK.id === 'homer' ? 'exam' : 'exam.' + WORK.id;

function setWork(id){
  const w = WORKS.find(x => x.id === id) || WORKS.find(x => x.status === 'reading') || WORKS[0];
  if(!w) throw new Error('no works on the shelf — data/manifest.js must define window.LOOM_WORKS');
  WORK = w;
  V = Object.assign({}, VOICE_DEFAULT, w.voice || {});
  PLAN = planFor(w);
  ORDER = PLAN.map(p => p.id);
  KIND.thread.label = `Cross-${w.unit.toLowerCase()} thread`;
  try{ localStorage.setItem('loom.work', w.id); }catch(e){}
}
function showWork(id){ setWork(id); showHome(); }

let current=null;
const authored = id => !!window.LOOM_DATA[id];
const isRead = id => localStorage.getItem('loom.read.'+id)==='1';
const setRead = (id,v) => localStorage.setItem('loom.read.'+id, v?'1':'0');
const bestScore = id => { const v=localStorage.getItem('loom.best.'+id); return v==null?null:+v; };
const saveScore = (id,s) => { const b=bestScore(id); if(b==null||s>b) localStorage.setItem('loom.best.'+id, s); };
const priorMiss = id => { try{ return JSON.parse(localStorage.getItem('loom.miss.'+id)||'[]'); }catch(e){ return []; } };
const saveMiss = (id,arr) => localStorage.setItem('loom.miss.'+id, JSON.stringify(arr));

/* ---- the day log: the first thing in the loom that knows what day it is ----
   Written ONLY from toggleRead() and the per-book reveal(), both of which fire
   only on a human action. seedProgress() writes read/best flags and never calls
   the day recorder, so seeded books are an undated past: they count toward
   lifetime totals and can never complete a day or begin a streak.

   The Daily Rite and the Grand Examination must NOT write this log. Only a
   per-book sitting can advance a day. */
/* The deadline is the open work's (manifest `deadline`); a work without one shows no
   countdown at all. `at` is an absolute instant so the final-night ticker is
   timezone- and DST-proof; `label` names the hour in the reader's words. */
const deadlineDay = () => WORK && WORK.deadline ? WORK.deadline.day : null;
const deadlineTs  = () => WORK && WORK.deadline ? Date.parse(WORK.deadline.at) : NaN;
const PASS_RATIO = 0.7;
const dayKey = k => 'loom.day.' + k;

function durable(){
  if(typeof window !== 'undefined' && window.__loomVolatile) return false;
  try{
    localStorage.setItem('__loom_durable','1');
    const ok = localStorage.getItem('__loom_durable')==='1';
    localStorage.removeItem('__loom_durable');
    return ok;
  }catch(e){ return false; }
}

function dayEntry(k){
  try{ return JSON.parse(localStorage.getItem(dayKey(k)) || '{"read":[],"sat":[]}'); }
  catch(e){ return {read:[],sat:[]}; }
}
function goalBooks(){
  try{ return (JSON.parse(localStorage.getItem('loom.goal')||'{}').books) || 1; }
  catch(e){ return 1; }
}
function setGoalBooks(n){
  try{ localStorage.setItem('loom.goal', JSON.stringify({books: Math.max(1, n|0)})); }catch(e){}
}
function readStreak(){
  try{ return JSON.parse(localStorage.getItem('loom.streak')||'null'); }catch(e){ return null; }
}

function bookPasses(id){
  const d = window.LOOM_DATA[id];
  const total = (d && d.quiz) ? d.quiz.length : 0;
  const best = bestScore(id);
  return total > 0 && best != null && best >= PASS_RATIO * total;
}

function booksDoneOn(k){
  const e = dayEntry(k);
  const touched = {};
  e.read.concat(e.sat).forEach(id => { touched[id] = true; });
  return Object.keys(touched).filter(id => isRead(id) && bookPasses(id)).length;
}
const booksDoneToday = () => booksDoneOn(LOOM_CLOCK.todayKey());
const dayComplete = k => booksDoneOn(k) >= goalBooks();

function recordDay(kind, id){
  const k = LOOM_CLOCK.todayKey();
  const e = dayEntry(k);
  if(e[kind].indexOf(id) < 0) e[kind].push(id);
  try{ localStorage.setItem(dayKey(k), JSON.stringify(e)); }catch(err){}
  if(dayComplete(k)){
    try{ localStorage.setItem('loom.streak', JSON.stringify(LOOM_CLOCK.streakNext(readStreak(), k))); }catch(err){}
  }
}

/* ---- authored progress seed ----
   No cross-device sync (that work is deferred — see
   docs/superpowers/plans/2026-07-06-future-user-auth-fastapi.md). Instead we bake
   baseline progress into the app so books already read + quizzed show as done on
   every device. Completion migrations run once per browser, so they can mark the
   current reading milestone without overriding future local choices on reload.
   Maintain by hand, deep-dive style: finish a book, add `id: <omen count>` below
   and redeploy. Score = the book's omen count (a perfect sitting). */
(function seedProgress(){
  const SEED = {
    'iliad-01':6, 'iliad-02':6, 'iliad-03':6, 'iliad-04':6,
    'iliad-05':6, 'iliad-06':6, 'iliad-07':6, 'iliad-08':6,
    'iliad-09':6, 'iliad-10':6, 'iliad-11':4, 'iliad-12':4,
    'iliad-13':4, 'iliad-14':4, 'iliad-15':4, 'iliad-16':4,
    'iliad-17':4, 'iliad-18':4, 'iliad-19':4, 'iliad-20':4,
    'iliad-21':4, 'iliad-22':4, 'iliad-23':4, 'iliad-24':4,
    'odyssey-01':6, 'odyssey-02':6, 'odyssey-03':7, 'odyssey-04':6,
    'odyssey-05':6, 'odyssey-06':6, 'odyssey-07':6, 'odyssey-08':6,
    'odyssey-09':6, 'odyssey-10':6, 'odyssey-11':6, 'odyssey-12':6,
    'odyssey-13':6, 'odyssey-14':6, 'odyssey-15':6, 'odyssey-16':6,
    'odyssey-17':6, 'odyssey-18':6, 'odyssey-19':6, 'odyssey-20':6,
    'odyssey-21':6, 'odyssey-22':7, 'odyssey-23':6, 'odyssey-24':6
  };   // id → best score (= perfect)
  const migration = 'loom.seed.all-complete.v1';
  try {
    const shouldComplete = localStorage.getItem(migration)==null;
    for(const id in SEED){
      if(shouldComplete || localStorage.getItem('loom.read.'+id)==null) localStorage.setItem('loom.read.'+id,'1');
      if(shouldComplete || localStorage.getItem('loom.best.'+id)==null || +localStorage.getItem('loom.best.'+id) < SEED[id]) localStorage.setItem('loom.best.'+id, String(SEED[id]));
      if(shouldComplete || localStorage.getItem('loom.miss.'+id)!=null) localStorage.removeItem('loom.miss.'+id);
    }
    if(shouldComplete) localStorage.setItem(migration,'1');
  } catch(e){ /* locked-down origin (raw file://): harness shim covers the bundle */ }
})();
const clearMiss = (id,qi) => saveMiss(id, priorMiss(id).filter(x=>x!==qi));
function allMisses(){
  const out=[];
  ORDER.filter(authored).forEach(id=>{
    const d=window.LOOM_DATA[id];
    priorMiss(id).forEach(qi=>{ if(d.quiz && d.quiz[qi]) out.push({id, qi, item:d.quiz[qi]}); });
  });
  return out;
}
const planOf = id => PLAN.find(p=>p.id===id);
/* A unit's short name. A thread may reach across the shelf (the play tying back to
   a Homer book), so an id outside the open work is named with its work's title. */
const label = id => {
  const p=planOf(id);
  if(p) return WORK.parts.length>1 ? `${p.short} · ${WORK.unit} ${p.n}` : `${WORK.unit} ${p.n}`;
  const w=workOf(id); const q = w && planFor(w).find(x=>x.id===id);
  return q ? `${w.title} · ${w.unit} ${q.n}` : id;
};

function boot(){
  let last=null, work=null;
  try{ last = localStorage.getItem('loom.last'); work = localStorage.getItem('loom.work'); }catch(e){}
  const lw = last && workOf(last);
  setWork(lw ? lw.id : work);
  if(last && authored(last)) showBook(last); else showHome();
}

/* The final-night ticker: while the home countdown is on screen, refresh it every
   second so "Atropos arrives in Xh Ym" stays live. Null-safe on every other view;
   when 7:30 PM ET passes with the door in view, re-render into "the door has opened". */
setInterval(() => {
  const el = document.querySelector('.door[data-countdown]');
  if(!el) return;
  const dr = doorText();
  if(dr.live) el.textContent = dr.text;
  else if(current === null) showHome();
}, 1000);

/* ---- HOME ---- */
/* Lachesis allots the measure; Atropos waits at the door. The pace line counts
   only books that are authored and unread, so unwritten future books do not
   inflate the day's burden. */
function bumpGoal(delta){ setGoalBooks(goalBooks() + delta); showHome(); }

/* The Atropos line, shared by the first render and the live ticker below.
   Far out → poetic day count; the final day → a ticking countdown to 7:30 PM ET;
   after the curtain → the door has opened. */
function doorText(){
  if(!deadlineDay()) return null;
  const left = ORDER.filter(id => authored(id) && !isRead(id)).length;
  const days = LOOM_CLOCK.daysUntil(deadlineDay());
  const leftFar  = left>0 ? fmt(V.unreadLeft,     { left, unitWord: unitWord(left) }) : V.unreadNone;
  const leftPast = left>0 ? fmt(V.unreadLeftPast, { left, unitWord: unitWord(left) }) : V.unreadNonePast;
  if(days > 0){
    return { live:false, text: fmt(V.doorFar, { days, dayWord: days===1?'day':'days', left: leftFar }) };
  }
  const label = LOOM_CLOCK.countdownLabel(deadlineTs());
  if(label){
    return { live:true, text: fmt(V.doorLive, { label, deadlineLabel: WORK.deadline.label || '', unread: left>0 ? ` · ${left} unread` : '' }) };
  }
  return { live:false, text: fmt(V.doorPast, { left: leftPast }) };
}

function riteCard(){
  const goal = goalBooks();
  const done = booksDoneToday();

  let h = `<div class="rite"><div class="hd">The day's measure</div>`;
  h += `<div class="goal"><b>${done}</b> of <b>${goal}</b> ${unitWord(goal)} today`;
  h += ` <button class="adj" onclick="bumpGoal(-1)" aria-label="fewer ${unitWord(2)}">-</button>`;
  h += ` <button class="adj" onclick="bumpGoal(1)" aria-label="more ${unitWord(2)}">+</button></div>`;
  h += done >= goal
    ? `<div class="meta">${V.dayKept}</div>`
    : `<div class="meta">${V.dayHow}</div>`;

  if(durable()){
    const s = readStreak();
    const c = s ? s.count : 0;
    h += c > 0
      ? `<div class="streak">✦ ${c} day${c===1?'':'s'} unbroken</div>`
      : `<div class="streak">${V.streakWaits}</div>`;
  }else{
    h += `<div class="meta">${V.volatile}</div>`;
  }

  const dr = doorText();
  if(dr) h += `<div class="door"${dr.live ? ' data-countdown="1"' : ''}>${dr.text}</div>`;
  return h + `</div>`;
}

function showHome(){
  current=null;
  localStorage.removeItem('loom.last');
  document.getElementById('topbar').innerHTML='';
  const authoredAll = PLAN.filter(p=>authored(p.id)).length;
  const readAll = PLAN.filter(p=>isRead(p.id)).length;
  const threadCount = ORDER.filter(authored).reduce((s,id)=> s + ((window.LOOM_DATA[id].threads||[]).length), 0);
  const examCount = ORDER.filter(authored).reduce((s,id)=> s + ((window.LOOM_DATA[id].quiz||[]).length), 0);
  let h='';
  const missCount = allMisses().length;
  const castN = castCount();
  if(WORKS.length > 1){
    h += `<div class="shelf">` + WORKS.map(w =>
      `<button class="${w.id===WORK.id?'active':''}" onclick="showWork('${w.id}')">${w.title}` +
      (w.status ? `<span class="st">${w.status}</span>` : '') + `</button>`).join('') + `</div>`;
  }
  h += `<div class="progress">${fmt(V.progress, { a:authoredAll, n:PLAN.length, r:readAll })}</div>`;
  h += `<div class="progbar"><i style="width:${(authoredAll/PLAN.length*100).toFixed(1)}%"></i></div>`;
  h += riteCard();
  if(examCount || threadCount || missCount || castN){
    h += `<div class="homeacts">`;
    if(readAll)     h += `<button onclick="showRite()">${V.riteBtn}</button>`;
    if(examCount)   h += `<button onclick="showExam()">${fmt(V.examBtn, {n:examCount})}</button>`;
    if(castN)       h += `<button onclick="showRoster()">${fmt(V.castBtn, {n:castN})}</button>`;
    if(threadCount) h += `<button onclick="showThreads()">${fmt(V.threadsBtn, {n:threadCount})}</button>`;
    if(missCount)   h += `<button onclick="showReview()">${fmt(V.reviewBtn, {n:missCount})}</button>`;
    h += `</div>`;
  }
  WORK.parts.forEach(part=>{
    const list = PLAN.filter(p=>p.part===part);
    const a = list.filter(p=>authored(p.id)).length;
    const name = WORK.parts.length>1 ? part.short : part.name;
    h += `<div class="band"><span>${name} · ${a}/${part.count}</span><hr></div><div class="grid">`;
    list.forEach(p=>{
      if(authored(p.id)){
        const d = window.LOOM_DATA[p.id]; const best=bestScore(p.id); const read=isRead(p.id);
        const total = d.quiz?d.quiz.length:0;
        const st = best!=null ? `${best}/${total}${read?' · ✓':''}` : (read?'✓ read':'open');
        h += `<div class="cell${read?' read':''}" onclick="showBook('${p.id}')"><div class="bk">${WORK.unit} ${p.n}</div><div class="tt">${d.meta.title}</div><div class="st">${st}</div></div>`;
      } else {
        h += `<div class="cell unwritten"><div class="bk">${WORK.unit} ${p.n}</div><div class="tt">unwritten</div></div>`;
      }
    });
    h += `</div>`;
  });
  document.getElementById('view').innerHTML = h;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---- THE DAILY RITE (practice; never spins the thread) ----
   Drawn only from read books: an epithet question can reveal a name as surely as
   a roster card. Deliberately does not write the day log. */
function readBooks(){
  return ORDER.filter(id => authored(id) && isRead(id))
              .map(id => ({ id, data: window.LOOM_DATA[id] }));
}

function showRite(){
  current = null;
  localStorage.removeItem('loom.last');
  document.getElementById('topbar').innerHTML =
    `<div class="grp"><button onclick="showHome()">${V.allUnits}</button>`+
      `<button onclick="showRoster()">Players</button>`+
      `<button onclick="showThreads()">Threads</button>`+
      `<button onclick="showExam()">Examination</button></div>`+
    `<div class="grp"><button class="active" disabled>${V.riteTab}</button></div>`;

  const books = readBooks();
  const voice = { hide:V.riteHide, seq:V.riteSeq, verbatim:V.riteVerbatim, recall:V.riteRecall };
  const draw = window.LOOM_OMENS.dailyRite(books, { n:5, rng:Math.random, label, voice });

  let h = `<div class="crown">${V.riteCrown}</div><h1>${V.riteTitle}</h1>`;
  if(!draw.length){
    h += `<div class="priorscore">${V.riteEmpty}</div>`;
    h += `<div class="footnav"><button onclick="showHome()">${V.allUnits}</button></div>`;
    document.getElementById('view').innerHTML = h;
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  h += `<div class="sub">${fmt(V.riteSub, {n:draw.length})}</div>`;
  h += renderThread(draw.length);
  h += `<div class="tally" id="tally">${draw.length} omens to read · none yet turned</div><div id="quiz"></div>`;
  h += `<div class="homeacts"><button onclick="showRite()">Draw again</button></div>`;
  h += `<div class="footnav"><button onclick="showHome()">${V.allUnits}</button><button onclick="showThreads()">Threads</button><button onclick="showReview()">Review</button></div>`;
  document.getElementById('view').innerHTML = h;

  const quiz = document.getElementById('quiz');
  let answered = 0, missed = 0;
  const finish = right => {
    if(!right){ missed++; frayThread(missed, draw.length); }
    answered++;
    document.getElementById('tally').textContent = `Omens read · ${answered} of ${draw.length}`;
  };

  draw.forEach(item => {
    const card = document.createElement('div'); card.className='q';
    const ki = KIND[item.kind] || KIND.event;
    card.innerHTML = `<div class="qhead"><span class="qkind ${ki.cls}">${ki.label}</span></div>`+
                     `<div class="qt">${item.q}</div>`;
    const truth = document.createElement('div'); truth.className='truth'; truth.innerHTML = item.truth;

    const render = formatOf(item) === 'sequence' ? renderSequence : renderChoice;
    render(card, item, right => { truth.classList.add('show'); finish(right); });
    card.appendChild(truth); quiz.appendChild(card);
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---- THREADS (cross-book view) ---- */
function showThreads(){
  current=null;
  localStorage.removeItem('loom.last');
  document.getElementById('topbar').innerHTML =
    `<div class="grp"><button onclick="showHome()">${V.allUnits}</button>`+
      `<button onclick="showRoster()">Players</button>`+
      `<button onclick="showReview()">Review</button>`+
      `<button onclick="showExam()">Examination</button></div>`+
    `<div class="grp"><button class="active" disabled>${V.threadsTab}</button></div>`;
  let h = `<div class="crown">${V.threadsCrown}</div><h1>${V.threadsTitle}</h1>`+
          `<div class="sub">${V.threadsSub}</div>`+
          `<div class="meta">follow a thread to walk the link in either direction</div>`;
  const sources = ORDER.filter(id=>authored(id) && (window.LOOM_DATA[id].threads||[]).length);
  if(!sources.length){
    h += `<div class="empty">${V.threadsEmpty}</div>`;
  } else {
    sources.forEach(id=>{
      const d = window.LOOM_DATA[id];
      h += `<div class="band"><span>From ${label(id)} — ${d.meta.title}</span><hr></div>`;
      (d.threads||[]).forEach(t=> h += threadCard(t, id));
    });
  }
  h += `<div class="footnav"><button onclick="showHome()">${V.allUnits}</button></div>`;
  document.getElementById('view').innerHTML = h;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* one thread card; `srcId` is the book it lives on */
function threadCard(t, srcId){
  const dir = t.dir==='back' ? '↩ a thread back' : (t.dir==='ahead' ? 'a thread ahead ↪' : '↔ a thread');
  const toAuthored = authored(t.to);
  const btn = toAuthored
    ? `<button class="lk" onclick="showBook('${t.to}')">Read ${label(t.to)} →</button>`
    : `<button class="lk" disabled>${label(t.to)} — unwritten</button>`;
  return `<div class="thread"><div class="dir">${dir}</div>`+
         `<div class="from">on ${label(srcId)} · links to ${label(t.to)}</div>`+
         `<h3 class="tt">${t.title}</h3><p class="nt">${t.note}</p>${btn}</div>`;
}

/* ---- ROSTER (the players the reading has met) ----
   Derived live from LOOM_DATA, exactly like the woven threads: no separate
   character file. A player met in several books is folded into one card that
   carries the trail of books they walk through.
   Only books the reader has finished are gathered: a name the reader has not
   met is itself a spoiler — that Helenus exists, that Dolon matters. Because
   every book here is read, every field on the card is read-gated for free. */
/* A character's band is the group it is authored under, matched against the work's
   cast bands. Anything unmatched falls to the 'god' band when it reads as divine
   (the Homer files flag gods), else to the first band. */
function bandFor(group, c){
  const exact = WORK.cast.find(g => g.name === group);
  if(exact) return exact;
  const godBand = WORK.cast.find(g => g.cls === 'god');
  if(godBand && (String(group).toLowerCase().includes('god') || (c && c.god))) return godBand;
  return WORK.cast[0];
}
const castCls = (group, c) => { const b = bandFor(group, c); return b.cls ? ' ' + b.cls : ''; };

function collectCast(){
  const groups = {};
  WORK.cast.forEach(g => { groups[g.name] = []; });
  const index = {};   // "Bucket|Name" -> card
  ORDER.filter(id=> authored(id) && isRead(id)).forEach(id=>{
    const d = window.LOOM_DATA[id];
    if(!d.characters) return;
    Object.keys(d.characters).forEach(group=>{
      (d.characters[group]||[]).forEach(c=>{
        const band = bandFor(group, c);
        const bucket = band.name;
        const key = bucket + '|' + c.name;
        if(!index[key]){
          index[key] = { name:c.name, epithet:c.epithet||'', cls:band.cls, books:[], epithets:[], notes:[] };
          groups[bucket].push(index[key]);
        }
        const card = index[key];
        if(card.books.indexOf(id)<0) card.books.push(id);
        if(c.epithet) card.epithet = c.epithet;
        // Keep each read book's note; castCard takes the last, the furthest the
        // reader has come. ORDER runs ascending, so notes[] ends up in book order.
        if(c.role || c.tag) card.notes.push({ book:id, role:c.role||'', tag:c.tag||'' });
        if(c.epithet){                                             // an epithet may shift book to book
          let e = card.epithets.find(x=> x.ep === c.epithet);
          if(!e){ e = { ep:c.epithet, books:[] }; card.epithets.push(e); }
          if(e.books.indexOf(id)<0) e.books.push(id);
        }
      });
    });
  });
  // most-present first, then alphabetical
  Object.keys(groups).forEach(g=> groups[g].sort((a,b)=> b.books.length - a.books.length || a.name.localeCompare(b.name)));
  return groups;
}
const castCount = () => { const g=collectCast(); return WORK.cast.reduce((s,b)=> s + g[b.name].length, 0); };

function showRoster(){
  current=null;
  localStorage.removeItem('loom.last');
  document.getElementById('topbar').innerHTML =
    `<div class="grp"><button onclick="showHome()">${V.allUnits}</button>`+
      `<button onclick="showThreads()">Threads</button>`+
      `<button onclick="showReview()">Review</button>`+
      `<button onclick="showExam()">Examination</button></div>`+
    `<div class="grp"><button class="active" disabled>The players</button></div>`;
  const cast = collectCast();
  const total = WORK.cast.reduce((s,b)=> s + cast[b.name].length, 0);
  const bookN = ORDER.filter(id=> authored(id) && isRead(id)).length;
  let h = `<div class="crown">${V.rosterCrown}</div><h1>${V.rosterTitle}</h1>`+
          `<div class="sub">${V.rosterSub}</div>`+
          `<div class="meta">${fmt(V.rosterMeta, { total, n:bookN, unitWord:unitWord(bookN) })}</div>`;
  if(!total){
    h += `<div class="empty">${V.rosterEmpty}</div>`;
  } else {
    WORK.cast.map(b=>b.name).forEach(group=>{
      const list = cast[group];
      if(!list.length) return;
      h += `<div class="band"><span>${group} · ${list.length}</span><hr></div>`;
      list.forEach(c=> h += castCard(c));
    });
  }
  h += `<div class="footnav"><button onclick="showHome()">${V.allUnits}</button><button onclick="showThreads()">Threads</button></div>`;
  document.getElementById('view').innerHTML = h;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Split a character's epithets into the part every book agrees on and the parts
   that shift. Hector is "breaker of horses" throughout, but "prince of Troy"
   until Book 6 and "bulwark of Troy" after it. Returns null when nothing shifts. */
function foldEpithets(eps){
  if(!eps || eps.length < 2) return null;
  const segs = eps.map(e=> e.ep.split(/,\s+/));
  const common = [];
  for(let i=0; i<segs[0].length; i++){
    const s = segs[0][i];
    if(segs.every(a=> a[i] === s)) common.push(s); else break;
  }
  // one epithet may be a prefix of another; give back segments until no tail is empty
  while(common.length && segs.some(a=> a.length === common.length)) common.pop();
  return {
    common: common.join(', '),
    variants: eps.map((e,i)=> ({ tail: segs[i].slice(common.length).join(', '), books:e.books }))
  };
}

/* one player card; `c` is a folded cast entry from collectCast() */
function castCard(c){
  const godcls = c.cls ? ' ' + c.cls : '';
  // Every book on the card is one the reader has finished — collectCast gathers no
  // other — so the trail is a record of where they met them, not a map of where
  // they will, and the epithets are only the ones those books have spoken.
  const books = c.books.map(id=>{ const p=planOf(id); return `<button class="lk" onclick="showBook('${id}')">${WORK.unit} ${p?p.n:id}</button>`; }).join('');
  const eps = c.epithets || [];
  const fold = foldEpithets(eps);
  let ep;
  if(!fold){
    ep = `<div class="ep${godcls}">${(eps[0] && eps[0].ep) || c.epithet}</div>`;
  } else {
    const rows = fold.variants.map(v=>{
      const ns = v.books.map(id=>{ const p=planOf(id); return p?p.n:id; }).join(' · ');
      return `<div class="epvar"><span class="ept">${v.tail}</span><span class="epbooks">${ns}</span></div>`;
    }).join('');
    ep = (fold.common ? `<div class="ep has-variants${godcls}">${fold.common}</div>` : '')
       + `<div class="eplist${godcls}">${rows}</div>`;
  }
  // Meet the character where the reader is: the last of their books, which is the
  // furthest one read. The "as of" label only earns its noise once the trail forks.
  const notes = c.notes || [];
  const note = notes[notes.length-1] || { book:'', role:'', tag:'' };
  const nb = note.book && planOf(note.book);
  const from = (nb && c.books.length > 1) ? `<div class="rlfrom">as of ${WORK.unit} ${nb.n}</div>` : '';
  return `<div class="c"><h4 class="nm">${c.name}</h4>${ep}`+
         `${from}<p class="rl">${note.role}</p>${note.tag?`<span class="tag">${note.tag}</span>`:''}`+
         `<div class="seen">Walks through</div><div class="castbooks">${books}</div></div>`;
}

/* ---- REVIEW (the missed omens, across every book) ---- */
function showReview(){
  current=null;
  localStorage.removeItem('loom.last');
  document.getElementById('topbar').innerHTML =
    `<div class="grp"><button onclick="showHome()">${V.allUnits}</button>`+
      `<button onclick="showRoster()">Players</button>`+
      `<button onclick="showThreads()">Threads</button>`+
      `<button onclick="showExam()">Examination</button></div>`+
    `<div class="grp"><button class="active" disabled>Re-walking the missed</button></div>`;
  const items = allMisses();
  let h = `<div class="crown">${V.reviewCrown}</div><h1>The Missed Omens</h1>`+
          `<div class="sub">${V.reviewSub}</div>`+
          `<div class="meta">${V.reviewMeta}</div>`;
  if(!items.length){
    h += `<div class="empty">${V.reviewEmpty}</div>`;
    h += `<div class="footnav"><button onclick="showHome()">${V.allUnits}</button></div>`;
    document.getElementById('view').innerHTML=h;
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  h += `<div class="tally" id="rtally">${items.length} ${items.length>1?V.reviewStrands:V.reviewStrand} · none yet re-walked</div>`;
  h += `<div id="review"></div>`;
  h += `<div id="reviewdone"><div class="crown" style="color:#eef3e2;">${V.reviewDoneCrown}</div><div class="rsum" id="rsum"></div><button onclick="showReview()">${V.reviewAgain}</button></div>`;
  h += `<div class="footnav"><button onclick="showHome()">${V.allUnits}</button><button onclick="showThreads()">Threads</button></div>`;
  document.getElementById('view').innerHTML=h;
  buildReview(items);
  window.scrollTo({top:0,behavior:'smooth'});
}

function buildReview(items){
  const box=document.getElementById('review');
  const total=items.length; let answered=0, mended=0;
  items.forEach(({id,qi,item})=>{
    const card=document.createElement('div'); card.className='q';
    const ki=KIND[item.kind||'event']||KIND.event;
    card.innerHTML =
      `<div class="reviewfrom">${label(id)} · ${item.n||''}</div>`+
      `<div class="qhead"><span class="qkind ${ki.cls}">${ki.label}</span></div>`+
      `<div class="qt">${item.q}</div>`;
    const truth=document.createElement('div'); truth.className='truth'; truth.innerHTML=item.truth;
    const view=shuffleOpts(item);
    view.opts.forEach((text,oi)=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=text;
      b.onclick=()=>{
        card.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        const btns=card.querySelectorAll('.opt');
        if(oi===view.correct){
          b.classList.add('correct'); clearMiss(id,qi); mended++;
          card.classList.add('cleared');
        } else {
          b.classList.add('wrong'); btns[view.correct].classList.add('correct');
        }
        truth.classList.add('show'); answered++;
        document.getElementById('rtally').textContent =
          fmt(V.reviewTally, { answered, total, mended, still: answered-mended });
        if(answered===total) reviewDone(mended,total);
      };
      card.appendChild(b);
    });
    card.appendChild(truth); box.appendChild(card);
  });
}

function reviewDone(mended,total){
  const d=document.getElementById('reviewdone');
  const still=total-mended;
  let line;
  if(still===0) line=fmt(V.reviewAll, { total });
  else if(mended===0) line=fmt(V.reviewNone, { still });
  else line=fmt(V.reviewSome, { mended, still });
  document.getElementById('rsum').textContent=line;
  d.classList.add('show'); d.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---- BOOK ---- */
function neighbors(id){
  const a = ORDER.filter(authored);
  const i = a.indexOf(id);
  return { prev: i>0?a[i-1]:null, next: (i>=0&&i<a.length-1)?a[i+1]:null };
}

function topbar(id){
  const p = planOf(id);
  const {prev,next} = neighbors(id);
  const read = isRead(id);
  document.getElementById('topbar').innerHTML =
    `<div class="grp">`+
      `<button onclick="showHome()">${V.allUnits}</button>`+
      `<button ${prev?`onclick="showBook('${prev}')"`:'disabled'}>← Prev</button>`+
      `<button ${next?`onclick="showBook('${next}')"`:'disabled'}>Next →</button>`+
      `<button onclick="showRoster()">Players</button>`+
      `<button onclick="showThreads()">Threads</button>`+
      `<button onclick="showReview()">Review</button>`+
      `<button onclick="showExam()">Examination</button>`+
    `</div>`+
    `<div class="grp"><span class="pos">${label(id)}</span>`+
      `<button class="readtoggle${read?' on':''}" onclick="toggleRead('${id}')">${read?'✓ Read':'Mark read'}</button>`+
    `</div>`;
}

function toggleRead(id){
  const now = !isRead(id);
  setRead(id, now);
  if(now) recordDay('read', id);
  topbar(id);
}

function showBook(id){
  if(!authored(id)) return;
  const w = workOf(id);
  if(w && (!WORK || w.id !== WORK.id)) setWork(w.id);   // a link may cross the shelf
  current=id; localStorage.setItem('loom.last', id);
  topbar(id);
  renderBody(window.LOOM_DATA[id]);
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderBody(d){
  const m=d.meta; let h='';
  h += `<div class="crown">◈ ${m.song} · ${m.epic} ◈</div><h1>${m.title}</h1>`;
  if(m.subtitle) h += `<div class="sub">${m.subtitle}</div>`;
  if(m.tagline) h += `<div class="meta">${m.tagline}</div>`;
  if(m.epigraph) h += `<div class="invoke">${m.epigraph.text}<span class="src">${m.epigraph.src||''}</span></div>`;
  if(d.recap&&d.recap.length) h += `<div class="recap"><span class="lbl">✦ Previously, on ${m.epic} ✦</span>${d.recap.map(p=>`<p>${p}</p>`).join('')}</div>`;
  if(d.scene&&d.scene.length) h += `<div class="scene"><span class="lbl">${V.sceneLabel}</span>${d.scene.map(p=>`<p>${p}</p>`).join('')}</div>`;
  if(d.terms&&d.terms.length){
    h += `<div class="band"><span>${V.termsBand}</span><hr></div><div class="terms">`+
      d.terms.map(t=>`<div class="t"><span class="gk">${t.gk}</span> — <span class="df">${t.def}</span></div>`).join('')+`</div>`;
  }
  if(d.movements&&d.movements.length){
    h += `<div class="band"><span>${V.movementsBand}</span><hr></div>`;
    d.movements.forEach(mv=>{ h += `<div class="movement"><div class="mnum">${mv.n||''}</div><h3 class="mtitle">${mv.title}</h3>${mv.what}<div class="why"><b>Why it matters:</b> ${mv.why}</div></div>`; });
  }
  if(d.panels&&d.panels.length){
    d.panels.forEach(p=>{ h += `<div class="simile"><span class="lbl">${p.label}</span>${p.lines.map(l=>`<p>${l}</p>`).join('')}</div>`; });
  }
  if(d.characters){
    Object.keys(d.characters).forEach(group=>{
      h += `<div class="band"><span>${group}</span><hr></div>`;
      d.characters[group].forEach(c=>{
        const godcls=castCls(group, c);
        h += `<div class="c"><h4 class="nm">${c.name}</h4><div class="ep${godcls}">${c.epithet}</div><p class="rl">${c.role}</p>${c.tag?`<span class="tag">${c.tag}</span>`:''}</div>`;
      });
    });
  }
  if(d.threads&&d.threads.length){
    h += `<div class="band"><span>${V.threadBand}</span><hr></div>`;
    d.threads.forEach(t=> h += threadCard(t, current));
  }
  if(d.quiz&&d.quiz.length){
    h += `<div class="divider">❧ · ❧ · ❧</div>`;
    h += `<div class="gate"><div class="crown">${V.gateCrown}</div><h2>${V.gateTitle}</h2><div class="sub">${fmt(V.gateSub, {n:d.quiz.length})}</div></div>`;
    const best=bestScore(current);
    h += `<div class="priorscore">${best!=null?`Your best reckoning here: ${best} / ${d.quiz.length}`:V.notYet}</div>`;
    const pm = priorMiss(current);
    if(pm.length) h += `<div class="missnote">↺ ${pm.length} omen${pm.length>1?'s':''} slipped last time — marked below. Linger there.</div>`;
    h += renderThread(d.quiz.length);
    h += `<div class="tally" id="tally">${d.quiz.length} omens to read · none yet turned</div><div id="quiz"></div>`;
    h += `<div id="verdict"><div class="crown" style="color:#e8c79a;">${V.verdictCrown}</div><div class="score" id="scoreNum"></div><div class="vline" id="vLine"></div><div class="breakdown" id="breakdown"></div><div class="small">${V.verdictSmall}</div><button onclick="showBook(current)">Sit the omens again</button></div>`;
  }
  const {prev,next}=neighbors(current);
  h += `<div class="footnav"><button ${prev?`onclick="showBook('${prev}')"`:'disabled'}>← Prev</button>`+
       `<button onclick="showHome()">${V.allUnits}</button>`+
       `<button ${next?`onclick="showBook('${next}')"`:'disabled'}>Next →</button></div>`;

  document.getElementById('view').innerHTML=h;
  if(d.quiz&&d.quiz.length) buildQuiz(d.quiz);
}

/* ---- quiz ---- */
/* The data pins the correct answer to a fixed slot (historically almost always
   index 1 — the second option), so a reader could pass by always tapping the
   second choice. Shuffle each question's options at render time and remap the
   correct index. Safe for persistence: misses/scores are keyed by question index
   (qi), never by option position. */
function shuffleOpts(item){
  const idx=item.opts.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return { opts: idx.map(i=>item.opts[i]), correct: idx.indexOf(item.correct) };
}

const FORMAT = { choice:'choice', sequence:'sequence' };
const formatOf = o => FORMAT[o && o.format] || FORMAT.choice;

function renderThread(total){
  const pips = Array.from({length: total}, () => '<i class="pip"></i>').join('');
  return `<div class="fraythread"><span class="lbl">${V.barLabel}</span>`+
         `<span class="pips">${pips}</span><span class="shears">${V.barEnd}</span></div>`;
}
function frayThread(missCount, total){
  const pips = document.querySelectorAll('.fraythread .pip');
  for(let i=0; i<pips.length; i++) pips[i].classList.toggle('frayed', i < missCount);
  const sh = document.querySelector('.fraythread .shears');
  if(sh) sh.classList.toggle('near', total>0 && missCount > total/2);
}

function renderChoice(card, item, onDone){
  const view = shuffleOpts(item);
  view.opts.forEach((text, oi) => {
    const b = document.createElement('button'); b.className='opt'; b.textContent = text;
    b.onclick = () => {
      card.querySelectorAll('.opt').forEach(x => x.disabled = true);
      const btns = card.querySelectorAll('.opt');
      const right = oi === view.correct;
      if(right) b.classList.add('correct');
      else { b.classList.add('wrong'); btns[view.correct].classList.add('correct'); }
      onDone(right);
    };
    card.appendChild(b);
  });
}

function renderSequence(card, item, onDone){
  const wrap = document.createElement('div'); wrap.className='seq';
  const chosen = [];
  item.items.forEach((title, idx) => {
    const b = document.createElement('button');
    b.className = 'beat'; b.type = 'button';
    b.innerHTML = `<span class="ord"></span>${title}`;
    b.onclick = () => {
      if(b.classList.contains('chosen')) return;
      chosen.push(idx);
      b.classList.add('chosen');
      b.querySelector('.ord').textContent = chosen.length + '.';
      if(chosen.length === item.items.length){
        wrap.querySelectorAll('.beat').forEach(x => x.disabled = true);
        const right = chosen.every((v,i) => v === item.answer[i]);
        wrap.querySelectorAll('.beat').forEach((x,i) => {
          const place = item.answer.indexOf(i);
          x.querySelector('.ord').textContent = (place+1) + '.';
          x.style.borderColor = right ? 'var(--ok)' : 'var(--line)';
        });
        onDone(right);
      }
    };
    wrap.appendChild(b);
  });
  card.appendChild(wrap);
}

/* A read book with a perfect best score is shown as already-completed: every
   question rendered pre-answered (correct option locked green, truth revealed),
   the golden verdict shown statically, and the "Sit the omens again" button
   repointed to a fresh attempt. No per-answer storage exists to restore, but a
   6/6 seed means every answer was correct, so this reconstruction is faithful.
   forceFresh (from retakeQuiz) skips this and builds a live, blank quiz. */
function buildQuiz(Q, forceFresh){
  const quiz=document.getElementById('quiz');
  if(!forceFresh && isRead(current) && bestScore(current)===Q.length){
    Q.forEach(item=>{
      const card=document.createElement('div'); card.className='q';
      const k=item.kind||'event'; const ki=KIND[k]||KIND.event;
      card.innerHTML=
        `<div class="qhead"><span class="qn">${item.n||''}</span>`+
        `<span class="qkind ${ki.cls}">${ki.label}</span></div>`+
        `<div class="qt">${item.q}</div>`;
      const truth=document.createElement('div'); truth.className='truth show'; truth.innerHTML=item.truth;
      const view=shuffleOpts(item);
      view.opts.forEach((text,oi)=>{
        const b=document.createElement('button'); b.className='opt'; b.textContent=text; b.disabled=true;
        if(oi===view.correct) b.classList.add('correct');
        card.appendChild(b);
      });
      card.appendChild(truth); quiz.appendChild(card);
    });
    document.getElementById('tally').textContent=fmt(V.heldLine, {n:Q.length});
    const stats={}; Q.forEach(item=>{ const k=item.kind||'event'; (stats[k]=stats[k]||{c:0,t:0}); stats[k].c++; stats[k].t++; });
    const v=document.getElementById('verdict');
    document.getElementById('scoreNum').textContent=`${Q.length} / ${Q.length}`;
    document.getElementById('vLine').textContent=V.verdict[0];
    const order=['event','meaning','thread'];
    document.getElementById('breakdown').innerHTML =
      order.filter(k=>stats[k]).map(k=>`<span class="bk">${KIND[k].label} · ${stats[k].c}/${stats[k].t}</span>`).join('');
    v.classList.add('show');
    const again=v.querySelector('button'); if(again) again.onclick=retakeQuiz;
    return;
  }
  const pm = priorMiss(current);
  let answered=0, score=0;
  const missArr=[];
  const stats={};  // kind -> {c,t}
  Q.forEach(item=>{ const k=item.kind||'event'; (stats[k]=stats[k]||{c:0,t:0}).t++; });

  Q.forEach((item,qi)=>{
    const card=document.createElement('div'); card.className='q';
    const k = item.kind||'event';
    const ki = KIND[k]||KIND.event;
    const missedBefore = pm.includes(qi);
    card.innerHTML=
      `<div class="qhead"><span class="qn">${item.n||''}</span>`+
      `<span class="qkind ${ki.cls}">${ki.label}</span>`+
      `${missedBefore?'<span class="missflag">↺ missed last time</span>':''}</div>`+
      `<div class="qt">${item.q}</div>`;
    const truth=document.createElement('div'); truth.className='truth'; truth.innerHTML=item.truth;
    const renderer = formatOf(item)==='sequence' ? renderSequence : renderChoice;
    renderer(card, item, right => {
      if(right){ score++; stats[k].c++; }
      else { missArr.push(qi); frayThread(missArr.length, Q.length); }
      truth.classList.add('show'); answered++;
      document.getElementById('tally').textContent=`Omens read · ${answered} of ${Q.length}`;
      if(answered===Q.length) reveal(score, Q.length, stats, missArr);
    });
    card.appendChild(truth); quiz.appendChild(card);
  });
}

/* Leave the completed view and start a fresh, blank attempt without disturbing
   the stored best score (saveScore only ever raises it). */
function retakeQuiz(){
  const d=window.LOOM_DATA[current]; if(!d||!d.quiz) return;
  const v=document.getElementById('verdict');
  if(v){ v.classList.remove('show'); const again=v.querySelector('button'); if(again) again.onclick=()=>showBook(current); }
  document.getElementById('quiz').innerHTML='';
  frayThread(0, d.quiz.length);
  document.getElementById('tally').textContent=`${d.quiz.length} omens to read · none yet turned`;
  buildQuiz(d.quiz, true);
}

function reveal(score,total,stats,missArr){
  saveScore(current,score);
  saveMiss(current, missArr.slice().sort((a,b)=>a-b));
  recordDay('sat', current);
  const v=document.getElementById('verdict');
  document.getElementById('scoreNum').textContent=`${score} / ${total}`;
  const pct=score/total; let line;
  if(pct===1) line=V.verdict[0];
  else if(pct>=0.7) line=V.verdict[1];
  else if(pct>=0.4) line=V.verdict[2];
  else if(pct>0) line=V.verdict[3];
  else line=V.verdict[4];
  document.getElementById('vLine').textContent=line;
  const order=['event','meaning','thread'];
  const bd = order.filter(k=>stats[k]).map(k=>`<span class="bk">${KIND[k].label} · ${stats[k].c}/${stats[k].t}</span>`).join('');
  document.getElementById('breakdown').innerHTML = bd;
  v.classList.add('show'); v.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---- THE GRAND EXAMINATION (every authored book, one cumulative sitting) ---- */
/* Pool every quiz omen across all authored books, each tagged with its source book
   so a miss/mend can flow back into the per-book Review loop. */
function examPool(){
  const out=[];
  ORDER.filter(authored).forEach(id=>{
    const d=window.LOOM_DATA[id];
    (d.quiz||[]).forEach((item,qi)=> out.push({srcId:id, qi, item}));
  });
  return out;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function showExam(){
  current=null;
  localStorage.removeItem('loom.last');
  document.getElementById('topbar').innerHTML =
    `<div class="grp"><button onclick="showHome()">${V.allUnits}</button>`+
      `<button onclick="showRoster()">Players</button>`+
      `<button onclick="showThreads()">Threads</button>`+
      `<button onclick="showReview()">Review</button></div>`+
    `<div class="grp"><button class="active" disabled>The Grand Examination</button></div>`;
  const pool = shuffle(examPool());
  const total = pool.length;
  let h = `<div class="crown">${V.examCrown}</div><h1>The Grand Examination</h1>`+
          `<div class="sub">${fmt(V.examSub, {n:total})}</div>`+
          `<div class="meta">${V.examMeta}</div>`;
  if(!total){
    h += `<div class="empty">${V.examEmpty}</div>`+
         `<div class="footnav"><button onclick="showHome()">${V.allUnits}</button></div>`;
    document.getElementById('view').innerHTML=h; window.scrollTo({top:0,behavior:'smooth'}); return;
  }
  const best=bestScore(examKey());
  h += `<div class="priorscore">${best!=null?fmt(V.examBest, {best, total}):'Not yet sat in full.'}</div>`;
  h += `<div class="divider">❧ · ❧ · ❧</div>`;
  h += `<div class="tally" id="tally">${total} omens to read · none yet turned</div><div id="exam"></div>`;
  h += `<div id="verdict"><div class="crown" style="color:#e8c79a;">${V.examVerdictCrown}</div><div class="score" id="scoreNum"></div><div class="vline" id="vLine"></div><div class="breakdown" id="breakdown"></div><div class="books" id="bookbreak"></div><div class="small">${V.examSmall}</div><button onclick="showExam()">Sit the full reckoning again</button></div>`;
  h += `<div class="footnav"><button onclick="showHome()">${V.allUnits}</button><button onclick="showThreads()">Threads</button><button onclick="showReview()">Review</button></div>`;
  document.getElementById('view').innerHTML=h;
  buildExam(pool);
  window.scrollTo({top:0,behavior:'smooth'});
}

function buildExam(items){
  const box=document.getElementById('exam');
  const total=items.length; let answered=0, score=0;
  const stats={};   // kind   -> {c,t}
  const byBook={};  // srcId  -> {c,t}
  items.forEach(({srcId,item})=>{ const k=item.kind||'event';
    (stats[k]=stats[k]||{c:0,t:0}).t++; (byBook[srcId]=byBook[srcId]||{c:0,t:0}).t++; });
  items.forEach(({srcId,qi,item},idx)=>{
    const card=document.createElement('div'); card.className='q';
    const k=item.kind||'event'; const ki=KIND[k]||KIND.event;
    card.innerHTML=
      `<div class="qhead"><span class="qn">Omen ${idx+1} of ${total}</span>`+
      `<span class="qkind ${ki.cls}">${ki.label}</span></div>`+
      `<div class="qt">${item.q}</div>`;
    const truth=document.createElement('div'); truth.className='truth';
    const view=shuffleOpts(item);
    view.opts.forEach((text,oi)=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=text;
      b.onclick=()=>{
        card.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        const btns=card.querySelectorAll('.opt');
        if(oi===view.correct){ b.classList.add('correct'); score++; stats[k].c++; byBook[srcId].c++; clearMiss(srcId,qi); }
        else{ b.classList.add('wrong'); btns[view.correct].classList.add('correct');
              saveMiss(srcId, Array.from(new Set([...priorMiss(srcId), qi])).sort((a,b)=>a-b)); }
        /* source book stays hidden until answered, then revealed with the truth */
        truth.innerHTML = item.truth + `<div class="examsrc">— ${label(srcId)}${item.n?` · ${item.n}`:''}</div>`;
        truth.classList.add('show'); answered++;
        document.getElementById('tally').textContent=`Omens read · ${answered} of ${total}`;
        if(answered===total) examReveal(score,total,stats,byBook);
      };
      card.appendChild(b);
    });
    card.appendChild(truth); box.appendChild(card);
  });
}

function examReveal(score,total,stats,byBook){
  saveScore(examKey(),score);
  const v=document.getElementById('verdict');
  document.getElementById('scoreNum').textContent=`${score} / ${total}`;
  const pct=score/total; let line;
  if(pct===1) line=V.examVerdict[0];
  else if(pct>=0.85) line=V.examVerdict[1];
  else if(pct>=0.7) line=V.examVerdict[2];
  else if(pct>=0.4) line=V.examVerdict[3];
  else if(pct>0) line=V.examVerdict[4];
  else line=V.examVerdict[5];
  document.getElementById('vLine').textContent=line;
  const order=['event','meaning','thread'];
  const bd=order.filter(k=>stats[k]).map(k=>`<span class="bk">${KIND[k].label} · ${stats[k].c}/${stats[k].t}</span>`).join('');
  document.getElementById('breakdown').innerHTML=bd;
  /* per-book reckoning — canonical reading order; a book under half its omens is flagged to re-walk */
  const rows = ORDER.filter(authored).filter(id=>byBook[id]).map(id=>{
    const {c,t}=byBook[id]; const pct=Math.round((c/t)*100); const weak=c/t<0.5;
    return `<div class="brow${weak?' weak':''}"><span class="bl">${label(id)}</span>`+
           `<span class="bbar"><i style="width:${pct}%"></i></span>`+
           `<span class="bsc">${c}/${t}</span></div>`;
  }).join('');
  document.getElementById('bookbreak').innerHTML = rows
    ? `<h4>${V.byUnit}</h4>${rows}` : '';
  v.classList.add('show'); v.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---- kickoff: load authored data files, then boot (runs after all decls) ---- */
let pending = LOAD.length;
if(!pending) boot();
LOAD.forEach(id=>{
  const s=document.createElement('script'); s.src=`../data/${id}.js`;
  s.onload=s.onerror=()=>{ if(--pending===0) boot(); };
  document.head.appendChild(s);
});
</script>
